<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../main.css" rel="stylesheet" type="text/css">
    <script src="../main.js" type="module"></script>
    <title>PC</title>
</head>
<body id="PC">
    <div id="nav">
        <a href="../index.html" class="navBtn" id="backBtn"><button>&lt; Back</button></a>
    </div>
    <img id="playerAvatarBox"></img>
    <div id="playerRosterBox">
        <div class="rosterHolder"></div>
        <div class="rosterHolder"></div>
        <div class="rosterHolder"></div>
        <div class="rosterHolder"></div>
        <div class="rosterHolder"></div>
        <div class="rosterHolder"></div>
    </div>
    <div id="playerPCBox"></div>
    <div id="playerInventoryBox"></div>
    <div id="playerBadgeBox">
        <span id="avatarChangeWrap">
            <label id="avatarLabel" for="changeAvatar">Choose your Trainer</label>
            <select class="changeAvatar" id="changeAvatarMale">
                <option value="null">--</option>
                <option value="ash-sinnoh">Ash</option>
                <option value="barry">Barry</option>
                <option value="gladion">Gladion</option>
                <option value="hau">Hau</option>
                <option value="player-go">Kim</option>
                <option value="roy">Roy</option>
                <option value="spark-casual">Ruben</option>
            </select>
        <select class="changeAvatar" id="changeAvatarFemale">
                <option value="null">--</option>
                <option value="becca">Becca</option>
                <option value="bianca">Bianca</option>
                <option value="dawn-gen4pt">Dawn</option>
                <option value="trialguidef">Isabella</option>
                <option value="lillie">Lillie</option>
                <option value="may-rs">May</option>
                <!-- <option value="raifort">Raifort</option> -->
                <option value="serena">Serena</option>
                <option value="sina">Sina</option>
            </select>
        </span>
        <div id="badgeCase" class="profileSection">
            <div id="badgeRegionWrap">
                <button id="kantoCase" class="playerBadgeCase">Kanto</button>
                <button id="johtoCase" class="playerBadgeCase">Johto</button>
                <!-- <button id="hoennCase" class="playerBadgeCase">Hoenn</button>
                <button id="sinnohCase" class="playerBadgeCase">Sinnoh</button> 
                <button id="unovaCase" class="playerBadgeCase">Unova</button>
                <button id="kalosCase" class="playerBadgeCase">Kalos</button> -->
            </div>
                <table>
                    <tr>
                        <td id="Badge1" class="badgeHolder"><img/></td>
                        <td id="Badge2" class="badgeHolder"><img/></td>
                    </tr>
                    <tr>
                        <td id="Badge3" class="badgeHolder"><img/></td>
                        <td id="Badge4" class="badgeHolder"><img/></td>
                    </tr>
                    <tr>
                        <td id="Badge5" class="badgeHolder"><img/></td>
                        <td id="Badge6" class="badgeHolder"><img/></td>
                    </tr>
                    <tr>
                        <td id="Badge7" class="badgeHolder"><img/></td>
                        <td id="Badge8" class="badgeHolder"><img/></td>
                    </tr>
                </table>
        </div>
